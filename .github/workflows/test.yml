# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tests

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Generate self-signed certificates
      run: |
        # Make the script executable and run it
        chmod +x ./create-self-signed-certs.sh
        ./create-self-signed-certs.sh

    - name: Start RabbitMQ container manually
      run: |
        # We start the container manually as a step to ensure that the certificate
        # and config files exist on the host before we try to mount them.
        docker run -d --name rabbitmq \
          -p 5672:5672 \
          -p 5671:5671 \
          -v ${{ github.workspace }}/.certs/rabbitmq:/etc/ssl:ro \
          -v ${{ github.workspace }}/external_config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro \
          -e RABBITMQ_DEFAULT_USER=guest \
          -e RABBITMQ_DEFAULT_PASS=guest \
          rabbitmq:3-management-alpine
    - name: Wait for RabbitMQ to start
      run: |
        echo "Waiting for RabbitMQ to initialize..."
        # Give the container time to start up and apply the configuration.
        sleep 8
    - name: Set up Python 3.8
      uses: actions/setup-python@v3
      with:
        python-version: "3.8"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pika coverage
        if [ -f dev_requirements.txt ]; then pip install -r dev_requirements.txt; fi
    - name: Run unit tests with coverage
      run: |
        coverage run --source=amqp_client_python -m pytest -v tests/unit/
    - name: Run integration tests with coverage
      run: |
        coverage run --append --source=amqp_client_python -m pytest -v tests/integration/
      env:
        AMQP_DOMAIN: localhost
    - name: Generate and show combined coverage report
      run: |
        coverage report --show-missing